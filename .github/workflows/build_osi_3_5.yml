name: Build & release OSI 3.5

on:
  push:
    tags:
      - osi-v3.5.[0-9]+*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.configuration }} ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup_tools_shared

      - name: Build OSI
        shell: bash
        run: ${{ matrix.os == 'ubuntu-22.04' && 'xvfb-run' || '' }} ./osi/generate_osi_3_5_libs.sh

      - name: Bundle platform package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-22.04) ARCHIVE_NAME="osi-linux.tar.xz" ; FOLDER_NAME="linux" ;;
            macos-14)    ARCHIVE_NAME="osi-macos.tar.xz" ; FOLDER_NAME="mac" ;;
            windows-2022) ARCHIVE_NAME="osi-windows.tar.xz" ; FOLDER_NAME="v10" ;;
          esac

          tar -cJvf "$ARCHIVE_NAME" "$FOLDER_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: [build]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release.yml
