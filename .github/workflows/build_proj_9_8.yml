name: Build & release PROJ 9.8

on:
  push:
    tags:
      - proj-v9.8.[0-9]+*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup_tools_shared

      - name: Build PROJ
        shell: bash
        run: ./proj/generate_proj_9_8_libs.sh

      - name: Bundle package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-22.04) ARCHIVE_NAME="proj-linux.tar.xz" ; FOLDER_NAME="linux" ;;
            macos-14)    ARCHIVE_NAME="proj-macos.tar.xz" ; FOLDER_NAME="mac" ;;
            windows-2022) ARCHIVE_NAME="proj-windows.tar.xz" ; FOLDER_NAME="v10" ;;
          esac

          tar -cJvf "$ARCHIVE_NAME" "$FOLDER_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: [build]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release.yml
